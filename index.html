<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saavi's Cafe | Digital Menu</title>
  <meta name="description" content="Saavi's Cafe digital menu">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
    .top{position:sticky;top:0;z-index:10;text-align:center;padding:14px 10px;
         background:#111;border-bottom:1px solid #d88a00}
    .top h1{margin:0;font-size:24px;color:#f5a400}
    .top p{margin:4px 0 0;color:#ddd;font-size:13px}
    .menu{max-width:900px;margin:0 auto;padding:12px}
    .menu img{display:block;width:100%;height:auto;border-radius:8px}
    .zoom{position:fixed;right:18px;bottom:18px;background:#f5a400;color:#111;
          border:0;border-radius:50%;width:52px;height:52px;font-size:22px;
          box-shadow:0 4px 16px #0008}
    .hint{text-align:center;color:#bbb;font-size:12px;padding:0 0 18px}
  </style>
</head>
<body>
  <div class="top">
    <h1>☕ SAAVI'S CAFE</h1>
    <p>Where Every Moment Is Special</p>
  </div>
  <main class="menu">
    <img src="menu.jpg" alt="Saavi's Cafe Menu">
    <div class="hint">Pinch to zoom • Scroll to view the full menu</div>
  </main>
</body>
</html>
